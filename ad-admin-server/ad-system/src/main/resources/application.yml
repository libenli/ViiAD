server:
  port: ${SERVER_PORT:8882}

spring:
  application:
    name: ad-admin-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MRD_UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${MRD_UPLOAD_MAX_REQUEST_SIZE:520MB}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0


dubbo:
  application:
    name: viiad-server

  scan:
    base-packages: com.mrd.ad

  protocol:
    name: dubbo
    port: 20895
    serialization: kryo
    optimizer: com.mysher.mtalk.serializer.SerializationOptimizerImpl

  registry:
    address: zookeeper://localhost:12181
    file: /opt/dubbo-cache/viiad-server/dubbo.cache
    check: true
    simplified: true

  reference:
    check: false

  consumer:
    check: false
    timeout: 5000

mrd:
  auth:
    captcha:
      expire-seconds: ${MRD_AUTH_CAPTCHA_EXPIRE_SECONDS:180}
    verification-code:
      expire-seconds: ${MRD_AUTH_CODE_EXPIRE_SECONDS:300}
      max-send-per-hour: ${MRD_AUTH_CODE_MAX_SEND_PER_HOUR:5}
      mock-send: ${MRD_AUTH_CODE_MOCK_SEND:true}
    forgot-password:
      reset-token-expire-seconds: ${MRD_AUTH_RESET_TOKEN_EXPIRE_SECONDS:300}
    sms:
      access-key-id: ${MRD_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${MRD_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${MRD_SMS_SIGN_NAME:}
      region-id: ${MRD_SMS_REGION_ID:cn-hangzhou}
      template-code:
        zh: ${MRD_SMS_TEMPLATE_ZH:}
        en: ${MRD_SMS_TEMPLATE_EN:}
        overseas: ${MRD_SMS_TEMPLATE_OVERSEAS:}
    email:
      host: ${MRD_EMAIL_HOST:}
      port: ${MRD_EMAIL_PORT:465}
      username: ${MRD_EMAIL_USERNAME:}
      password: ${MRD_EMAIL_PASSWORD:}
      from: ${MRD_EMAIL_FROM:}
      from-name: ${MRD_EMAIL_FROM_NAME:ViiAD}
      ssl: ${MRD_EMAIL_SSL:true}
      starttls: ${MRD_EMAIL_STARTTLS:false}
  upload:
    provider: local
    local-path: ${MRD_UPLOAD_LOCAL_PATH:./uploads}
    public-base-url: ${MRD_UPLOAD_PUBLIC_BASE_URL:http://127.0.0.1:8080/uploads}
    base-path: materials
    oss:
      endpoint: ${MRD_OSS_ENDPOINT:}
      access-key-id: ${MRD_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${MRD_OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${MRD_OSS_BUCKET_NAME:}
      public-base-url: ${MRD_OSS_PUBLIC_BASE_URL:}
  mq:
    enabled: ${MRD_MQ_ENABLED:true}
    host: ${MRD_MQ_HOST:localhost}
    port: ${MRD_MQ_PORT:2772}
    username: ${MRD_MQ_USERNAME:MysherViiTALK}
    password: ${MRD_MQ_PASSWORD:Mysher.com.viitalk}
    viiad-c2s-rule: '{"exchangeType":"direct","exchange":"mysher.exchange.direct.command.c2s","binding":"vii_ad.c2s","queueName":"mysher.server.viiad.c2s"}'
    only-china-device: ${MRD_MQ_ONLY_CHINA_DEVICE:true}
  pay:
    wechat:
      enabled: ${MRD_PAY_WECHAT_ENABLED:true}
      app-id: ${MRD_PAY_WECHAT_APP_ID:wx0c5a69619728dda7}
      mch-id: ${MRD_PAY_WECHAT_MCH_ID:1748437313}
      api-key: ${MRD_PAY_WECHAT_API_KEY:8ff1c1743cfc4585ae35810059cb9d36}
      notify-url: ${MRD_PAY_WECHAT_NOTIFY_URL:https://testad.viitalk.com/api/pay/notify/wechat}
      unified-order-url: ${MRD_PAY_WECHAT_UNIFIED_ORDER_URL:https://api.mch.weixin.qq.com/pay/unifiedorder}
      refund-enabled: ${MRD_PAY_WECHAT_REFUND_ENABLED:true}
      refund-url: ${MRD_PAY_WECHAT_REFUND_URL:https://api.mch.weixin.qq.com/secapi/pay/refund}
      refund-query-url: ${MRD_PAY_WECHAT_REFUND_QUERY_URL:https://api.mch.weixin.qq.com/pay/refundquery}
      refund-cert-path: ${MRD_PAY_WECHAT_REFUND_CERT_PATH:/opt/mysher/apiclient_cert.p12}
      refund-cert-password: ${MRD_PAY_WECHAT_REFUND_CERT_PASSWORD:1748437313}
      body-prefix: ${MRD_PAY_WECHAT_BODY_PREFIX:ViiAD充值}
    alipay:
      enabled: ${MRD_PAY_ALIPAY_ENABLED:true}
      app-id: ${MRD_PAY_ALIPAY_APP_ID:2021003125698900}
      merchant-private-key: ${MRD_PAY_ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${MRD_PAY_ALIPAY_PUBLIC_KEY:}
      notify-url: ${MRD_PAY_ALIPAY_NOTIFY_URL:https://testad.viitalk.com/api/pay/notify/alipay}
      gateway-url: ${MRD_PAY_ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      refund-enabled: ${MRD_PAY_ALIPAY_REFUND_ENABLED:true}
      charset: ${MRD_PAY_ALIPAY_CHARSET:UTF-8}
      sign-type: ${MRD_PAY_ALIPAY_SIGN_TYPE:RSA2}
      subject-prefix: ${MRD_PAY_ALIPAY_SUBJECT_PREFIX:ViiAD充值}
    refund-sync:
      enabled: ${MRD_PAY_REFUND_SYNC_ENABLED:true}
      initial-delay-ms: ${MRD_PAY_REFUND_SYNC_INITIAL_DELAY_MS:15000}
      fixed-delay-ms: ${MRD_PAY_REFUND_SYNC_FIXED_DELAY_MS:60000}
      batch-size: ${MRD_PAY_REFUND_SYNC_BATCH_SIZE:50}
      max-retries: ${MRD_PAY_REFUND_SYNC_MAX_RETRIES:20}
