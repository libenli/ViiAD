server:
  port: ${SERVER_PORT:8882}

spring:
  application:
    name: ad-admin-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MRD_UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${MRD_UPLOAD_MAX_REQUEST_SIZE:520MB}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mrd:
  upload:
    provider: local
    local-path: ${MRD_UPLOAD_LOCAL_PATH:./uploads}
    public-base-url: ${MRD_UPLOAD_PUBLIC_BASE_URL:http://127.0.0.1:8080/uploads}
    base-path: materials
    oss:
      endpoint: ${MRD_OSS_ENDPOINT:}
      access-key-id: ${MRD_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${MRD_OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${MRD_OSS_BUCKET_NAME:}
      public-base-url: ${MRD_OSS_PUBLIC_BASE_URL:}
