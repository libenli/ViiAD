spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MRD_DB_URL}
    username: ${MRD_DB_USERNAME}
    password: ${MRD_DB_PASSWORD}
  redis:
    host: ${MRD_REDIS_HOST:127.0.0.1}
    port: ${MRD_REDIS_PORT:6379}
    database: ${MRD_REDIS_DATABASE:0}
    password: ${MRD_REDIS_PASSWORD:}

logging:
  level:
    com.mrd.ad: warn

mrd:
  upload:
    provider: ${MRD_UPLOAD_PROVIDER:oss}
    base-path: ${MRD_UPLOAD_BASE_PATH:materials/prod}
    oss:
      endpoint: ${MRD_OSS_ENDPOINT}
      access-key-id: ${MRD_OSS_ACCESS_KEY_ID}
      access-key-secret: ${MRD_OSS_ACCESS_KEY_SECRET}
      bucket-name: ${MRD_OSS_BUCKET_NAME}
      public-base-url: ${MRD_OSS_PUBLIC_BASE_URL}
